x-staging: &staging
  image: ${TA3000_STAGING_IMAGE:?set the image digest from the protected plan}
  working_dir: /workspace
  init: true
  mem_limit: ${TA3000_STAGING_MEMORY_LIMIT:-6g}
  memswap_limit: ${TA3000_STAGING_MEMORY_LIMIT:-6g}
  cpus: ${TA3000_STAGING_CPUS:-2}
  tmpfs:
    - /tmp:size=${TA3000_STAGING_SCRATCH_BYTES:?set the scratch byte cap},mode=1777
  environment: &environment
    DAGSTER_HOME: /opt/dagster/dagster_home
    PYTHONPATH: /workspace/src
    TA3000_STAGING_PLAN: /staging-control/plan.json
    TA3000_RESEARCH_DATA_PREP_DATASET_VERSION: ${TA3000_STAGING_DATASET_VERSION:?set the pinned consumer dataset version}
    TA3000_MOEX_HISTORICAL_DATA_ROOT: /ta3000-data/moex-historical
    TA3000_MOEX_PRODUCT_RUNTIME_STAGING_ROOT: /ta3000-data/moex-historical
    TA3000_MOEX_VERIFICATION_STAGING_ROOT: /ta3000-data/moex-historical
    TA3000_MOEX_CANONICALIZATION_SPARK_PROFILE: local
    TA3000_MOEX_CANONICALIZATION_SPARK_MASTER: local[2]
    TA3000_SPARK_DRIVER_MEMORY: ${TA3000_STAGING_SPARK_MEMORY:-3g}
    DAGSTER_SENSOR_GRPC_TIMEOUT_SECONDS: "600"
    NUMBA_CACHE_DIR: /tmp/numba
  volumes:
    - staging-home:/opt/dagster/dagster_home
    - ./dagster-staging-instance.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
    - ${TA3000_STAGING_CANDIDATE_WORKTREE:?set the frozen candidate worktree}:/workspace:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}:/staging-verifier:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}/src/trading_advisor_3000/product_plane/common/staging_execution.py:/workspace/src/trading_advisor_3000/product_plane/common/staging_execution.py:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}/src/trading_advisor_3000/product_plane/common/staging_contracts.py:/workspace/src/trading_advisor_3000/product_plane/common/staging_contracts.py:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}/src/trading_advisor_3000/product_plane/common/staging_source_scope.py:/workspace/src/trading_advisor_3000/product_plane/common/staging_source_scope.py:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}/src/trading_advisor_3000/product_plane/common/staging_route_proof.py:/workspace/src/trading_advisor_3000/product_plane/common/staging_route_proof.py:ro
    - ${TA3000_STAGING_VERIFIER_WORKTREE:?set the protected verifier worktree}/src/trading_advisor_3000/product_plane/contracts/schemas/staging_acceptance.v1.json:/workspace/src/trading_advisor_3000/product_plane/contracts/schemas/staging_acceptance.v1.json:ro
    - ${TA3000_STAGING_CONTROL_ROOT:?set the protected control directory}:/staging-control:ro
    - ${TA3000_STAGING_QUOTA_ROOT:?set a persistent shared quota directory}:/staging-quota:ro
    - ${TA3000_STAGING_HOST_STATE:?set the persistent host supervisor directory}:/staging-host-state:ro
    - ${TA3000_STAGING_DATA_ROOT:?set independent staging data}:/ta3000-data/moex-historical
    - ${TA3000_STAGING_CONTROL_ROOT:?set the protected control directory}/root-marker.json:/ta3000-data/moex-historical/.ta3000-staging.json:ro
  networks:
    - staging

services:
  webserver:
    <<: *staging
    command: [dagster-webserver, -m, trading_advisor_3000.dagster_defs, -a, product_plane_definitions, -h, 0.0.0.0, -p, "3000", -d, /workspace]
    environment:
      <<: *environment
      TA3000_RESEARCH_WORKER_OWNER: webserver
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
  daemon:
    <<: *staging
    command: [dagster-daemon, run, -m, trading_advisor_3000.dagster_defs, -a, product_plane_definitions, -d, /workspace]
    environment:
      <<: *environment
      TA3000_RESEARCH_WORKER_OWNER: daemon
    depends_on:
      webserver:
        condition: service_healthy

volumes:
  staging-home:
networks:
  staging:
    driver: bridge
